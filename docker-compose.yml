services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skolski_dnevnik}
      MYSQL_USER: ${MYSQL_USER:-skola}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-skola_dev_password}
    ports:
      - "3306:3306"
    volumes:
      - dnevnik_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dnevnik_mysql:
